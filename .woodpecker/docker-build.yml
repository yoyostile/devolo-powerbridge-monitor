steps:
  build:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      mtu: 1420
      registry: https://ghcr.io
      repo: ghcr.io/yoyostile/devolo-powerbridge-monitor

      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

      dockerfile: Dockerfile
      context: .
      platforms: linux/amd64
    when:
      branch: main
      event: [push, manual]

  build-pr:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      mtu: 1420
      dockerfile: Dockerfile
      platforms: linux/amd64

      dry_run: true
    when:
      branch:
        exclude: main
      event: [pull_request, manual, push]
